version: '3.8'


services:

  sentiment-analyzer-backend:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: sentiment-analyzer-backend

    ports:

      - "8080:8080"

    environment:

      - JAVA_OPTS=-Xmx512m -Xms256m

      - SERVER_PORT=8080

      - SERVER_SERVLET_CONTEXT_PATH=/api

    restart: unless-stopped

    networks:

      - sentiment-network

    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:8080/api/analyze"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 40s

    logging:

      driver: "json-file"

      options:

        max-size: "10m"

        max-file: "3"


  # Nginx reverse proxy for frontend and API routing

  nginx:

    image: nginx:alpine

    container_name: sentiment-analyzer-nginx

    ports:

      - "80:80"

      - "443:443"

    volumes:

      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      - ./index.html:/usr/share/nginx/html/index.html:ro

      - ./pages:/usr/share/nginx/html/pages:ro

      - ./assets:/usr/share/nginx/html/assets:ro

      - /etc/letsencrypt:/etc/letsencrypt:ro  # For SSL certificates (optional)

    depends_on:

      - sentiment-analyzer-backend

    restart: unless-stopped

    networks:

      - sentiment-network

    logging:

      driver: "json-file"

      options:

        max-size: "10m"

        max-file: "3"


networks:

  sentiment-network:

    driver: bridge
